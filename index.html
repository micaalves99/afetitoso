<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Movimentação de Estoque - Saída</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .produto {
      margin-bottom: 10px;
    }
    .quantidade {
      display: none;
      margin-left: 10px;
    }
    .erro {
      color: red;
      margin-top: 10px;
    }
    .sucesso {
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Movimentação de Estoque - Saída</h2>

  <label for="unidade">Unidade destino:</label>
  <select id="unidade" required>
    <option value="">-- Selecione a Unidade --</option>
    <option value="Matriz">Matriz</option>
    <option value="Abadia">Abadia</option>
    <option value="Mirassol">Mirassol</option>
  </select>

  <h3>Produtos:</h3>
  <div id="produtos"></div>

  <button onclick="enviar()">Enviar</button>
  <div class="erro" id="erro"></div>
  <div class="sucesso" id="status"></div>

  <script>
    const listaProdutos = [
      "Pizza", "Carne", "Carne e Queijo", "Frango", "Carne e Gueirova",
      "Queijo", "Costela", "Calabresa", "Gueirova", "Coxinha de Frango",
      "Coxinha de Costela", "Quibe de Ovo", "Quibe de Carne",
      "Quibe com Queijo", "Salsicha"
    ];

    const produtosDiv = document.getElementById("produtos");

    listaProdutos.forEach(produto => {
      const div = document.createElement("div");
      div.className = "produto";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = `check-${produto}`;
      checkbox.onchange = () => {
        const input = document.getElementById(`quant-${produto}`);
        input.style.display = checkbox.checked ? "inline" : "none";
        if (!checkbox.checked) input.value = "";
      };

      const label = document.createElement("label");
      label.textContent = produto;
      label.htmlFor = `check-${produto}`;

      const input = document.createElement("input");
      input.type = "number";
      input.min = "1";
      input.id = `quant-${produto}`;
      input.placeholder = "Quantidade";
      input.className = "quantidade";

      div.appendChild(checkbox);
      div.appendChild(label);
      div.appendChild(input);

      produtosDiv.appendChild(div);
    });

    async function enviar() {
      document.getElementById("erro").innerText = "";
      document.getElementById("status").innerText = "";

      const unidade = document.getElementById("unidade").value;
      if (!unidade) {
        document.getElementById("erro").innerText = "Por favor, selecione uma unidade.";
        return;
      }

      const produtosSelecionados = [];

      listaProdutos.forEach(produto => {
        const checkbox = document.getElementById(`check-${produto}`);
        const input = document.getElementById(`quant-${produto}`);
        const quantidade = parseInt(input.value);

        if (checkbox.checked && quantidade > 0) {
          produtosSelecionados.push({
            nome: produto,
            qtd: quantidade
          });
        }
      });

      if (produtosSelecionados.length === 0) {
        document.getElementById("erro").innerText = "Preencha a quantidade de pelo menos um produto.";
        return;
      }

      try {
        const resposta = await fetch("https://script.google.com/macros/s/AKfycbwbPZuKWQXcDCTe0s6OjubWdPTWl4gxG84C18tlW3Aejw4vUpaxIMnqkNMlQaytysEG/exec", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            unidade: unidade,
            produtos: produtosSelecionados
          })
        });

        if (resposta.ok) {
          document.getElementById("status").innerText = "Dados enviados com sucesso!";
          document.getElementById("unidade").value = "";
          listaProdutos.forEach(produto => {
            document.getElementById(`check-${produto}`).checked = false;
            const input = document.getElementById(`quant-${produto}`);
            input.value = "";
            input.style.display = "none";
          });
        } else {
          document.getElementById("erro").innerText = "Erro ao enviar dados. Tente novamente.";
        }
      } catch (erro) {
        console.error(erro);
        document.getElementById("erro").innerText = "Erro na conexão. Verifique a URL do Web App.";
      }
    }
  </script>
</body>
</html>
